    <style>
      /* Inline, loads instantly. Prevents a flash of the wrong theme
         before the bundled CSS/JS finishes loading, especially on a
         slower connection. --ch-bg is stamped by the script below. */
      html, body { margin: 0; padding: 0; background: var(--ch-bg, #FFF8EF); }
    </style>
    <script>
      /* Same palette and same localStorage key as src/lib/theme.js.
         Runs before first paint so a dark-theme visitor never sees the
         cream app flash white-to-dark on reload. */
      (function () {
        try {
          var stored = localStorage.getItem("chesshatch_theme") || localStorage.getItem("chessloop_theme");
          var mode = stored === "light" || stored === "dark"
            ? stored
            : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          var bg = mode === "dark" ? "#17110D" : "#FFF8EF";
          var root = document.documentElement;
          root.setAttribute("data-theme", mode);
          root.style.colorScheme = mode;
          root.style.setProperty("--ch-bg", bg);
          root.style.backgroundColor = bg;
          var meta = document.createElement("meta");
          meta.setAttribute("name", "theme-color");
          meta.setAttribute("content", bg);
          document.head.appendChild(meta);
        } catch (e) { /* private mode: stay on the light default */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
